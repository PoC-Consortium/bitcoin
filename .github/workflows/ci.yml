name: CI
on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: CI (ENABLE_POCX=OFF)
    uses: ./.github/workflows/ci-product.yml
    with:
      product: bitcoin
