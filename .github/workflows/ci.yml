name: CI
on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:
    inputs:
      baseline_only:
        description: 'Run only the original Bitcoin unit diagnostic; this is not full CI'
        type: boolean
        default: false
  schedule:
    - cron: '19 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: CI (ENABLE_POCX=OFF)
    uses: ./.github/workflows/ci-product.yml
    with:
      product: bitcoin
      baseline_only: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_only || false }}
