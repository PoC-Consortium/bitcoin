# Implementation only: CI and CI-POCX are the two independently triggered workflows.
name: Product CI implementation
on:
  workflow_call:
    inputs:
      product:
        description: 'bitcoin (ENABLE_POCX=OFF) or pocx (ENABLE_POCX=ON)'
        required: true
        type: string
      baseline_only:
        description: 'Manual original Bitcoin unit diagnostic only'
        default: false
        type: boolean

permissions:
  contents: read

env:
  CI_PRODUCT: ${{ inputs.product }}
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1  # GHA does not care about dangling processes and setting this variable avoids killing the CI script itself on error
  REPO_USE_WARP_RUNNERS: 'bitcoin/bitcoin' # Use warp runners for this repo, instead of falling back to the slow GHA runners

defaults:
  run:
    # Enforce fail-fast behavior for all platforms.
    # See: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

jobs:
  bitcoin-baseline:
    name: 'Original Bitcoin unit baseline only'
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_only && inputs.product == 'bitcoin'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install the standard unit profile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev python3-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Build and verify the original Bitcoin unit profile
        run: .ci-venv/bin/python test/pocx/ci.py --profile bitcoin-unit --jobs 2
      - name: Retain baseline reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-bitcoin-unit-baseline
          path: |
            build-ci-bitcoin-unit/ci-results-*/
            build-ci-bitcoin-unit/bitcoin-unit-*/
            build-ci-bitcoin-unit/Testing/
          if-no-files-found: error

  runners:
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') }}
    name: '[meta] determine runners'
    runs-on: ubuntu-slim
    outputs:
      provider: ${{ steps.runners.outputs.provider }}
    steps:
      - &ANNOTATION_PR_NUMBER
        name: Annotate with pull request number
        # This annotation is machine-readable and can be used to assign a check
        # run to its corresponding pull request. Running in all check runs is
        # required, because check re-runs discard the annotations of other
        # tasks in the test suite.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=debug_pull_request_number_str::${{ github.event.number }}"
          fi
      - id: runners
        run: |
          if [[ "${REPO_USE_WARP_RUNNERS}" == "${{ github.repository }}" ]]; then
            echo "provider=warp" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner Selection::Using Warp Runners"
          else
            echo "provider=gha" >> "$GITHUB_OUTPUT"
            echo "::notice title=Runner Selection::Using GitHub-hosted runners"
          fi

  test-each-commit:
    name: 'test ancestor commits'
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-8x' || 'ubuntu-latest' }}
    env:
      TEST_RUNNER_PORT_MIN: "14000"  # Use a larger port range to avoid colliding with other CI services.
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (github.event_name == 'pull_request' && github.event.pull_request.commits != 1) }}
    timeout-minutes: 360  # Use maximum time, see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes.
    steps:
      - name: Determine fetch depth
        run: echo "FETCH_DEPTH=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_ENV"
      - *ANNOTATION_PR_NUMBER
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.FETCH_DEPTH }}
      - name: Determine commit range
        run: |
          # Checkout HEAD~ and find the test base commit.
          # Checkout HEAD~ because it would be wasteful to rerun
          # tests on the PR head commit that are already run
          # by other jobs.
          git checkout HEAD~
          # Moreover, pull requests that contain a merge commit
          # are generally draft pull requests that merge in other
          # pull requests, so only check the relevant commits
          # after the last merge commit. A merge commit could
          # also be a subtree merge commit, which may be
          # worthwhile to check. However, it is rare that the
          # subtree merge commit is not the top commit (which
          # would be skipped anyway by this task, because it is
          # run by all other tasks). Also, `git rebase --exec`
          # does not work on merge commits, so if this was
          # important to check, the logic would have to be
          # rewritten.
          #
          # Figure out test base commit by listing ancestors of
          # HEAD, excluding ancestors of the most recent merge
          # commit, ordering them from oldest to newest, and
          # taking the first one.
          #
          # In the command below, the ^@ suffix is used to refer
          # to all parents of the merge commit as described in:
          # https://git-scm.com/docs/git-rev-parse#_other_rev_parent_shorthand_notations
          # and the ^ prefix is used to exclude these parents
          # and all their ancestors from the rev-list output
          # as described in:
          # https://git-scm.com/docs/git-rev-list
          MERGE_BASE=$(git rev-list -n1 --merges HEAD)
          EXCLUDE_MERGE_BASE_ANCESTORS=()
          # MERGE_BASE can be empty due to limited fetch-depth
          if test -n "$MERGE_BASE"; then
            EXCLUDE_MERGE_BASE_ANCESTORS=("^${MERGE_BASE}^@")
          fi
          echo "TEST_BASE=$(git rev-list -n${{ github.event.pull_request.commits }} --reverse HEAD "${EXCLUDE_MERGE_BASE_ANCESTORS[@]}" | head -1)" >> "$GITHUB_ENV"
      - run: |
          git fetch origin "${GITHUB_BASE_REF}"
          git config user.email "ci@example.com"
          git config user.name "CI"
      - run: |
          sudo apt-get update
          sudo apt-get install clang mold ccache build-essential cmake ninja-build pkgconf python3-zmq python3-venv python3-bpfcc bpfcc-tools "linux-headers-$(uname -r)" libevent-dev libboost-dev libsqlite3-dev systemtap-sdt-dev libzmq3-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev capnproto libcapnp-dev -y
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Compile and run tests
        run: |
          # Run tests on commits after the last merge commit and before the PR head commit
          # Original USDT cases require root and the matching BPF prerequisites.
          git rebase --exec "git merge --no-commit origin/${GITHUB_BASE_REF} && sudo env CI_PRODUCT=\"${CI_PRODUCT}\" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=\"${GITHUB_WORKSPACE}\" .ci-venv/bin/python ./test/pocx/revision_ci.py --phase-consensus \"${CI_PRODUCT}\" && git reset --hard" ${{ env.TEST_BASE }}

      - name: Upload selected product test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inherited-tests-${{ inputs.product }}-${{ github.job }}
          path: |
            artifacts/pocx-inherited
            ci_build*/pocx-inherited-*/*.json
            ci_build*/pocx-inherited-*/*.xml
            ci_build*/pocx-inherited-*/*.csv
            ci_build*/pocx-inherited-*/*.log
            ci_build*/pocx-inherited-*/*/*.json
            ci_build*/pocx-inherited-*/*/*.xml
            ci_build*/pocx-inherited-*/*/*.csv
            ci_build*/pocx-inherited-*/*/*.log
            ci_build*/bitcoin-unit-*/*.json
            ci_build*/bitcoin-unit-*/*.xml
            ci_build*/bitcoin-unit-*/*.csv
            ci_build*/bitcoin-unit-*/*.log
            ci_build*/pocx-unit-*/*.json
            ci_build*/pocx-unit-*/*.xml
            ci_build*/pocx-unit-*/*.csv
            ci_build*/pocx-unit-*/*.log
          if-no-files-found: warn

  macos-native-arm64:
    name: ${{ matrix.job-name }}
    # Use any image to support the xcode-select below, but hardcode version to avoid silent upgrades (and breaks).
    # See: https://github.com/actions/runner-images#available-images.
    runs-on: macos-15

    # When a contributor maintains a fork of the repo, any pull request they make
    # to their own fork, or to the main repository, will trigger two CI runs:
    # one for the branch push and one for the pull request.
    # This can be avoided by setting SKIP_BRANCH_PUSH=true as a custom env variable
    # in Github repository settings.
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (vars.SKIP_BRANCH_PUSH != 'true' || github.event_name != 'push') }}

    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        job-type: [standard]
        include:
          - job-type: standard
            file-env: './ci/test/00_setup_env_mac_native.sh'
            job-name: 'macOS native'

    env:
      DANGER_RUN_CI_ON_HOST: 1
      BASE_ROOT_DIR: ${{ github.workspace }}/repo_archive

    steps:
      - *ANNOTATION_PR_NUMBER

      - &CHECKOUT
        name: Checkout
        uses: actions/checkout@v6
        with:
          # Ensure the latest merged pull request state is used, even on re-runs.
          ref: &CHECKOUT_REF_TMPL ${{ github.event_name == 'pull_request' && github.ref || '' }}

      - name: Clang version
        run: |
          # Use the latest Xcode supported by the version of macOS denoted in
          # doc/release-notes-empty-template.md and providing at least the
          # minimum clang version denoted in doc/dependencies.md.
          # See: https://developer.apple.com/documentation/xcode-release-notes/xcode-16_2-release-notes
          sudo xcode-select --switch /Applications/Xcode_16.2.app
          clang --version

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          # A workaround for "The `brew link` step did not complete successfully" error.
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet coreutils ninja pkgconf ccache boost libevent zeromq qt@6 qrencode capnp

      - name: Set Ccache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"

      - name: Restore Ccache cache
        id: ccache-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ inputs.product }}-${{ github.job }}-${{ matrix.job-type }}-ccache-${{ github.run_id }}
          restore-keys: ${{ inputs.product }}-${{ github.job }}-${{ matrix.job-type }}-ccache-

      - name: Create git archive
        run: |
          git log -1
          git archive --format=tar --prefix=repo_archive/ --output=repo.tar HEAD
          tar -xf repo.tar

      - name: CI script
        run: |
          cd repo_archive
          ./ci/test_run_all.sh
        env:
          FILE_ENV: ${{ matrix.file-env }}

      - name: Upload selected product test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inherited-tests-${{ inputs.product }}-${{ github.job }}-${{ strategy.job-index }}
          path: repo_archive/artifacts/pocx-inherited
          if-no-files-found: warn

      - name: Save Ccache cache
        uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CCACHE_DIR }}
          # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: ${{ inputs.product }}-${{ github.job }}-${{ matrix.job-type }}-ccache-${{ github.run_id }}

  windows-native-dll:
    name: ${{ matrix.job-name }}
    runs-on: windows-2025-vs2026

    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (vars.SKIP_BRANCH_PUSH != 'true' || github.event_name != 'push') }}

    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
      # Source review hashes require the repository's LF bytes on Windows too.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'

    strategy:
      fail-fast: false
      matrix:
        job-type: [standard]
        include:
          - job-type: standard
            job-name: 'Windows native, VS'

    steps:
      - *ANNOTATION_PR_NUMBER

      - *CHECKOUT

      - &IMPORT_VS_ENV
        name: Import Visual Studio env vars
        run: py -3 .github/ci-windows.py "standard" github_import_vs_env

      - name: Get tool information
        run: |
          set -o errexit -o pipefail -o xtrace -o nounset

          cmake -version | tee cmake_version
          echo '---'
          msbuild.exe -version | tee msbuild_version
          echo "${VCToolsVersion-}" | tee toolset_version
          py -3 --version
          bash --version

      - name: Using vcpkg with MSBuild
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          # Workaround for libevent, which requires CMake 3.1 but is incompatible with CMake >= 4.0.
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"

      - name: Set VCPKG_ROOT
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Restore vcpkg tools cache
        id: vcpkg-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: C:/vcpkg/downloads/tools
          key: ${{ inputs.product }}-${{ github.job }}-vcpkg-tools-${{ github.run_id }}
          restore-keys: ${{ inputs.product }}-${{ github.job }}-vcpkg-tools-

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        id: vcpkg-binary-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ inputs.product }}-${{ github.job }}-vcpkg-binary-${{ hashFiles('cmake_version', 'msbuild_version', 'toolset_version', 'vcpkg.json') }}

      - name: Verify selected product on native Windows
        env:
          TEST_RUNNER_EXTRA: "--timeout-factor=${{ env.TEST_RUNNER_TIMEOUT_FACTOR }} ${{ case(github.event_name == 'pull_request', '', '--extended') }}"
        run: py -3 test/pocx/windows_ci.py

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.vcpkg-binary-cache.outputs.cache-hit != 'true' && matrix.job-type == 'standard'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ inputs.product }}-${{ github.job }}-vcpkg-binary-${{ hashFiles('cmake_version', 'msbuild_version', 'toolset_version', 'vcpkg.json') }}

      - name: Save vcpkg tools cache
        uses: actions/cache/save@v5
        # Only save cache from one job as they share tools. If the matrix is expanded to jobs with unique tools, this may need amending.
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && steps.vcpkg-tools-cache.outputs.cache-hit != 'true' && matrix.job-type == 'standard'
        with:
          path: C:/vcpkg/downloads/tools
          key: ${{ inputs.product }}-${{ github.job }}-vcpkg-tools-${{ github.run_id }}

      - name: Retain selected product native Windows test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-${{ inputs.product }}-${{ matrix.job-type }}-${{ github.run_id }}
          path: artifacts/pocx-inherited
          if-no-files-found: warn

  record-frozen-commit:
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') }}
    # Record frozen commit, so that the native tests on cross-builds can run on
    # the exact same commit id of the build.
    name: '[meta] record frozen commit'
    runs-on: ubuntu-slim
    outputs:
      commit: ${{ steps.record-commit.outputs.commit }}
    steps:
      - *ANNOTATION_PR_NUMBER
      - *CHECKOUT
      - name: Record commit
        id: record-commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-cross:
    name: 'Windows-cross to x86_64, ${{ matrix.crt }}'
    needs: [runners, record-frozen-commit]
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-4x' || 'ubuntu-latest' }}
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (vars.SKIP_BRANCH_PUSH != 'true' || github.event_name != 'push') }}

    strategy:
      fail-fast: false
      matrix:
        crt: [msvcrt, ucrt]
        include:
          - crt: msvcrt
            file-env: './ci/test/00_setup_env_win64_msvcrt.sh'
            artifact-name: 'x86_64-w64-mingw32-bitcoin-pocx-tests'
          - crt: ucrt
            file-env: './ci/test/00_setup_env_win64.sh'
            artifact-name: 'x86_64-w64-mingw32ucrt-bitcoin-pocx-tests'

    env:
      FILE_ENV: ${{ matrix.file-env }}
      DANGER_CI_ON_HOST_FOLDERS: 1
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'

    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.record-frozen-commit.outputs.commit }}

      - name: Configure environment
        uses: ./.github/actions/configure-environment

      - name: Restore caches
        id: restore-cache
        uses: ./.github/actions/cache/restore
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: CI script
        run: ./ci/test_run_all.sh

      - name: Upload selected product test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inherited-tests-${{ inputs.product }}-${{ github.job }}-${{ strategy.job-index }}
          path: |
            artifacts/pocx-inherited
            !artifacts/pocx-inherited/windows-cross-pair
          if-no-files-found: warn

      - name: Save caches
        uses: ./.github/actions/cache/save
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: Upload verified selected-product cross-build bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ inputs.product }}-${{ github.run_id }}
          path: artifacts/pocx-inherited/windows-cross-pair
          if-no-files-found: error

  windows-native-test:
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') }}
    name: 'Windows, ${{ matrix.crt }}, test cross-built'
    runs-on: windows-2022
    needs: [windows-cross, record-frozen-commit]

    strategy:
      fail-fast: false
      matrix:
        crt: [msvcrt, ucrt]
        include:
          - crt: msvcrt
            artifact-name: 'x86_64-w64-mingw32-bitcoin-pocx-tests'
          - crt: ucrt
            artifact-name: 'x86_64-w64-mingw32ucrt-bitcoin-pocx-tests'

    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
      PREVIOUS_RELEASES_DIR: ${{ github.workspace }}/prev_releases
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'

    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.record-frozen-commit.outputs.commit }}

      - name: Download verified selected-product cross-build bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}-${{ inputs.product }}-${{ github.run_id }}
          path: artifacts/windows-cross-pair

      - name: Verify immutable cross-build inputs
        run: py -3 test/pocx/windows_artifacts.py --verify artifacts/windows-cross-pair --product "${{ inputs.product }}"

      - *IMPORT_VS_ENV

      - name: Install functional ZMQ prerequisite
        shell: pwsh
        run: py -3 -m pip install pyzmq

      - name: Download checksum-verified previous releases
        shell: pwsh
        run: py -3 test/get_previous_releases.py --target-dir "$env:PREVIOUS_RELEASES_DIR"

      - name: Run complete selected-product artifact tests
        shell: pwsh
        env:
          TEST_RUNNER_EXTRA: "--timeout-factor=${{ env.TEST_RUNNER_TIMEOUT_FACTOR }} --extended"
        run: |
          py -3 test/pocx/windows_artifact_ci.py --artifacts artifacts/windows-cross-pair --product "${{ inputs.product }}" --output artifacts/windows-cross-runtime --timeout-factor "$env:TEST_RUNNER_TIMEOUT_FACTOR"

      - name: Retain bounded Bitcoin and PoCX runtime evidence
        if: always()
        run: py -3 test/pocx/windows_cross.py --collect-runtime artifacts/windows-cross-runtime --output artifacts/windows-cross-evidence

      - name: Upload Bitcoin and PoCX cross-runtime test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cross-runtime-${{ inputs.product }}-${{ matrix.crt }}-${{ github.run_id }}
          path: artifacts/windows-cross-evidence
          if-no-files-found: warn

  ci-matrix:
    name: ${{ matrix.name }}
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && matrix.warp-runner || matrix.fallback-runner }}
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (vars.SKIP_BRANCH_PUSH != 'true' || github.event_name != 'push') }}
    timeout-minutes: ${{ matrix.timeout-minutes }}

    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ${{ matrix.file-env }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'iwyu'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_iwyu.sh'

          - name: '32 bit ARM'
            warp-runner: 'ubuntu-24.04-arm' # Warp's Arm runners don't support 32-bit mode currently
            fallback-runner: 'ubuntu-24.04-arm'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_arm.sh'
            provider: 'gha'

          - name: 'i686, no IPC'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_i686_no_ipc.sh'

          - name: 'ASan + LSan + UBSan + integer'
            warp-runner: 'warp-ubuntu-2404-x64-8x' # has to match container in ci/test/00_setup_env_native_asan.sh for tracing tools
            fallback-runner: 'ubuntu-24.04'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_asan.sh'

          - name: 'macOS-cross to arm64'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_mac_cross.sh'

          - name: 'macOS-cross to x86_64'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_mac_cross_intel.sh'

          - name: 'No wallet'
            warp-runner: 'warp-ubuntu-latest-x64-4x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_nowallet.sh'

          - name: 'previous releases'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_previous_releases.sh'

          - name: 'Alpine (musl)'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_alpine_musl.sh'

          - name: 'tidy'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_tidy.sh'

          - name: 'TSan'
            warp-runner: 'warp-ubuntu-latest-x64-8x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_tsan.sh'

          - name: 'MSan'
            warp-runner: 'warp-ubuntu-latest-x64-16x'
            fallback-runner: 'ubuntu-latest'
            timeout-minutes: 120
            file-env: './ci/test/00_setup_env_native_msan.sh'

    steps:
      - *ANNOTATION_PR_NUMBER

      - *CHECKOUT

      - name: Configure environment
        uses: ./.github/actions/configure-environment

      - name: Restore caches
        id: restore-cache
        uses: ./.github/actions/cache/restore
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

      - name: Clear unnecessary files
        if: ${{ needs.runners.outputs.provider == 'gha' && true || false }} # Only needed on GHA runners
        uses: ./.github/actions/clear-files

      - name: Enable bpfcc script
        if: ${{ env.CONTAINER_NAME == 'ci_native_asan' }}
        # Select an owned wrapper available inside the image build too. Keep the
        # checksum-reviewed original environment script unchanged.
        run: echo 'FILE_ENV=./test/pocx/ci/00_setup_env_native_asan_tracing.sh' >> "$GITHUB_ENV"

      - name: Provision matching headers for enabled Linux USDT tests
        if: >-
          ${{ contains(fromJSON('["ci_native_asan", "ci_native_tsan", "ci_native_msan", "ci_native_nowallet", "ci_native_previous_releases", "ci_native_alpine_musl", "ci_i686_no_multiprocess", "ci_arm_linux"]'), env.CONTAINER_NAME) }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "linux-headers-$(uname -r)"
          test -d "/lib/modules/$(uname -r)/build"

      - name: Set mmap_rnd_bits
        if: ${{ env.CONTAINER_NAME == 'ci_native_tsan' || env.CONTAINER_NAME == 'ci_native_msan' }}
        # Prevents crashes due to high ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: CI script
        run: ./ci/test_run_all.sh

      - name: Upload selected product test evidence
        if: always() && env.RUN_FUZZ_TESTS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: inherited-tests-${{ inputs.product }}-${{ github.job }}-${{ strategy.job-index }}
          path: artifacts/pocx-inherited
          if-no-files-found: warn

      - name: Save caches
        uses: ./.github/actions/cache/save
        with:
          provider: ${{ matrix.provider || needs.runners.outputs.provider }}

  lint:
    name: 'lint'
    needs: runners
    runs-on: ${{ needs.runners.outputs.provider == 'warp' && 'warp-ubuntu-latest-x64-2x' || 'ubuntu-latest' }}
    if: ${{ (!inputs.baseline_only && github.event_name != 'schedule') && (vars.SKIP_BRANCH_PUSH != 'true' || github.event_name != 'push') }}
    timeout-minutes: 20
    env:
      CONTAINER_NAME: "bitcoin-linter"
    steps:
      - *ANNOTATION_PR_NUMBER

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: *CHECKOUT_REF_TMPL
          fetch-depth: 0

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          provider: ${{ needs.runners.outputs.provider }}

      - name: CI script
        run: |
          git worktree add ../lint-worktree HEAD
          ../lint-worktree/ci/lint.py

  source-review:
    if: ${{ !inputs.baseline_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install workflow parser
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-yaml
      - name: Check workflow organization and product isolation
        run: python3 -B test/pocx/test_product_workflows.py
      - name: Check reviewed source and adaptation drift
        run: python3 -B test/pocx/ci.py --profile drift
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-review-${{ inputs.product }}
          path: build-ci-drift/ci-results-*/


  linux-core:
    needs: source-review
    if: ${{ !inputs.baseline_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CI_BUILD: build-ci-${{ inputs.product }}-unit
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build and IPC test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev python3-venv
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Build once and run all unit and auxiliary cases
        run: .ci-venv/bin/python test/pocx/ci.py --profile "$CI_PRODUCT-unit" --build-dir "$CI_BUILD" --jobs 4
      - name: Run functional selection against the same configuration
        if: ${{ !cancelled() }}
        run: .ci-venv/bin/python test/pocx/ci.py --profile "$CI_PRODUCT-functional" --build-dir "$CI_BUILD" --skip-build --jobs 4
      - name: Retain test results and failure logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.product }}-linux-core-results
          path: |
            ${{ env.CI_BUILD }}/ci-results-*/
            ${{ env.CI_BUILD }}/pocx-unit-*/
            ${{ env.CI_BUILD }}/pocx-results-*/
            ${{ env.CI_BUILD }}/bitcoin-unit-*/
            ${{ env.CI_BUILD }}/Testing/


  linux-features:
    needs: source-review
    if: ${{ !inputs.baseline_only && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [qt, wallet-disabled, ipc-disabled, kernel]
    env:
      CI_PROFILE: ${{ inputs.product }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux and Qt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev python3-venv qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - run: .ci-venv/bin/python test/pocx/ci.py --profile '${{ env.CI_PROFILE }}' --jobs 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.CI_PROFILE }}-results
          path: |
            build-ci-${{ env.CI_PROFILE }}/ci-results-*/
            build-ci-${{ env.CI_PROFILE }}/pocx-unit-*/
            build-ci-${{ env.CI_PROFILE }}/bitcoin-unit-*/
            build-ci-${{ env.CI_PROFILE }}/Testing/
            build-ci-${{ env.CI_PROFILE }}/src/qt/test/Testing/


  optional-functional:
    needs: source-review
    if: ${{ !inputs.baseline_only && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Install complete optional functional prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev libzmq3-dev systemtap-sdt-dev python3-venv python3-zmq python3-bpfcc bpfcc-tools iproute2 "linux-headers-$(uname -r)"
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Download fresh checksum-verified previous releases
        run: .ci-venv/bin/python test/get_previous_releases.py --remove-dir --target-dir .ci-previous-releases v0.14.3 v0.20.1 v0.21.0 v22.0 v23.0 v24.0.1 v25.0 v28.2
      - name: Build selected optional configuration
        run: |
          consensus="$CI_PRODUCT"
          case "$consensus" in
            bitcoin) pocx=OFF ;;
            pocx) pocx=ON ;;
            *) exit 1 ;;
          esac
          cmake -S . -B "build-ci-$consensus-functional-optional" -G Ninja \
            -DENABLE_POCX="$pocx" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON \
            -DBUILD_GUI=OFF -DBUILD_BENCH=ON -DBUILD_FUZZ_BINARY=OFF -DBUILD_FOR_FUZZING=OFF \
            -DENABLE_WALLET=ON -DENABLE_IPC=ON -DBUILD_KERNEL_LIB=ON -DBUILD_UTIL_CHAINSTATE=ON \
            -DWITH_ZMQ=ON -DWITH_USDT=ON -DSANITIZERS= \
            -DBUILD_DAEMON=ON -DBUILD_CLI=ON -DBUILD_BITCOIN_BIN=ON \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON
          cmake --build "build-ci-$consensus-functional-optional" -j 4
      - name: Run selected product in an isolated network
        # Original USDT cases explicitly require root for BPF. Only this
        # scheduled/manual hosted job elevates, after installing/downloading
        # dependencies. Special public-address fixtures stay in a fresh netns.
        run: |
          sudo env CI_PRODUCT="$CI_PRODUCT" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            unshare --net /bin/bash -euo pipefail <<'SH'
          ip link set lo up
          # rpc_bind.py requires a non-loopback address distinct from 1.1.1.1.
          ip link add pocx-private type dummy
          ip address add 192.168.254.1/32 dev pocx-private
          ip link set pocx-private up
          ip link add pocx-test type dummy
          ip address add 1.1.1.1/32 dev pocx-test
          ip address add 2.2.2.2/32 dev pocx-test
          ip link set pocx-test up
          .ci-venv/bin/python test/pocx/ci.py --profile "$CI_PRODUCT-functional-optional" --skip-build --jobs 4 --previous-releases-dir .ci-previous-releases
          SH
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.product }}-optional-functional-results
          path: |
            build-ci-*-functional-optional/ci-results-*/
            build-ci-*-functional-optional/pocx-results-*/


  asan:
    needs: source-review
    if: ${{ !inputs.baseline_only && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Install inherited Clang 22 sanitizer toolchain and all test prerequisites
        run: |
          curl --fail --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key -o .ci-llvm-key.asc
          sudo install -m 644 .ci-llvm-key.asc /usr/share/keyrings/pocx-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/pocx-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/pocx-llvm-22.list
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf clang-22 llvm-22 libclang-rt-22-dev mold libevent-dev libboost-dev libsqlite3-dev capnproto libcapnp-dev libzmq3-dev systemtap-sdt-dev python3-venv python3-zmq python3-bpfcc bpfcc-tools iproute2 qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev "linux-headers-$(uname -r)"
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Download fresh checksum-verified previous releases
        run: .ci-venv/bin/python test/get_previous_releases.py --remove-dir --target-dir .ci-previous-releases v0.14.3 v0.20.1 v0.21.0 v22.0 v23.0 v24.0.1 v25.0 v28.2
      - name: Build selected complete sanitizer configuration
        run: |
          .ci-venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'test/pocx')
          from ci import options
          from sanitizer_ci import tools
          tools()
          for profile in (os.environ['CI_PRODUCT'] + '-asan',):
              build = Path('build-ci-' + profile)
              command = ['cmake', '-S', '.', '-B', str(build), '-G', 'Ninja', '-Werror=dev']
              command += [f'-D{key}={value}' for key, value in options(profile).items()]
              subprocess.run(command, check=True)
              subprocess.run(['cmake', '--build', str(build), '-j', '4'], check=True)
          PY
      - name: Run all selected-product sanitized frameworks
        # Root is required by unchanged BPF cases; fixture addresses stay in
        # this fresh network namespace. Sanitizer errors remain fatal.
        run: |
          sudo env CI_PRODUCT="$CI_PRODUCT" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            unshare --net /bin/bash -euo pipefail <<'SH'
          ip link set lo up
          # rpc_bind.py requires a non-loopback address distinct from 1.1.1.1.
          ip link add pocx-private type dummy
          ip address add 192.168.254.1/32 dev pocx-private
          ip link set pocx-private up
          ip link add pocx-test type dummy
          ip address add 1.1.1.1/32 dev pocx-test
          ip address add 2.2.2.2/32 dev pocx-test
          ip link set pocx-test up
          .ci-venv/bin/python test/pocx/ci.py --profile "$CI_PRODUCT-asan" --skip-build --jobs 4 --previous-releases-dir .ci-previous-releases
          SH
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.product }}-asan-results
          path: |
            build-ci-*-asan/ci-results-*/
            build-ci-*-asan/bitcoin-unit-*/
            build-ci-*-asan/pocx-unit-*/
            build-ci-*-asan/pocx-results-*/
            build-ci-*-asan/Testing/


  instrumented-sanitizers:
    needs: source-review
    if: ${{ !inputs.baseline_only && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [tsan, msan]
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang 22 and dependency build prerequisites
        run: |
          curl --fail --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key -o .ci-llvm-key.asc
          sudo install -m 644 .ci-llvm-key.asc /usr/share/keyrings/pocx-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/pocx-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/pocx-llvm-22.list
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkgconf autoconf automake libtool bison patch ccache clang-22 llvm-22 llvm-22-dev libclang-22-dev libclang-rt-22-dev python3-venv python3-zmq python3-bpfcc bpfcc-tools iproute2 "linux-headers-$(uname -r)"
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install pycapnp==2.2.4
      - name: Build pinned instrumented libc++ and inherited dependencies
        run: .ci-venv/bin/python test/pocx/prepare_instrumented_dependencies.py --sanitizer '${{ matrix.sanitizer }}' --directory '.ci-instrumented-${{ matrix.sanitizer }}' --jobs 4
      - name: Download fresh checksum-verified previous releases
        run: .ci-venv/bin/python test/get_previous_releases.py --remove-dir --target-dir .ci-previous-releases v0.14.3 v0.20.1 v0.21.0 v22.0 v23.0 v24.0.1 v25.0 v28.2
      - name: Build selected complete instrumented configuration
        env:
          SANITIZER_KIND: ${{ matrix.sanitizer }}
        run: |
          .ci-venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'test/pocx')
          from ci import options
          from instrumented_ci import verify_dependencies
          kind = os.environ['SANITIZER_KIND']
          directory = Path('.ci-instrumented-' + kind).resolve()
          verify_dependencies(kind, directory)
          for consensus in (os.environ['CI_PRODUCT'],):
              profile = consensus + '-' + kind
              build = Path('build-ci-' + profile)
              command = ['cmake', '-S', '.', '-B', str(build), '-G', 'Ninja', '-Werror=dev']
              command += [f'-D{key}={value}' for key, value in options(profile, directory).items()]
              subprocess.run(command, check=True)
              subprocess.run(['cmake', '--build', str(build), '-j', '4'], check=True)
          PY
      - name: Run applicable selected-product frameworks
        env:
          SANITIZER_KIND: ${{ matrix.sanitizer }}
        run: |
          sudo env CI_PRODUCT="$CI_PRODUCT" SANITIZER_KIND="$SANITIZER_KIND" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            unshare --net /bin/bash -euo pipefail <<'SH'
          ip link set lo up
          # rpc_bind.py requires a non-loopback address distinct from 1.1.1.1.
          ip link add pocx-private type dummy
          ip address add 192.168.254.1/32 dev pocx-private
          ip link set pocx-private up
          ip link add pocx-test type dummy
          ip address add 1.1.1.1/32 dev pocx-test
          ip address add 2.2.2.2/32 dev pocx-test
          ip link set pocx-test up
          .ci-venv/bin/python test/pocx/ci.py --profile "$CI_PRODUCT-$SANITIZER_KIND" --skip-build --jobs 4 --previous-releases-dir .ci-previous-releases --instrumented-dependencies-dir ".ci-instrumented-$SANITIZER_KIND"
          SH
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.product }}-${{ matrix.sanitizer }}-results
          path: |
            .ci-instrumented-${{ matrix.sanitizer }}/preparation.json
            .ci-instrumented-${{ matrix.sanitizer }}/*.log
            build-ci-*-${{ matrix.sanitizer }}/ci-results-*/
            build-ci-*-${{ matrix.sanitizer }}/bitcoin-unit-*/
            build-ci-*-${{ matrix.sanitizer }}/pocx-unit-*/
            build-ci-*-${{ matrix.sanitizer }}/pocx-results-*/
            build-ci-*-${{ matrix.sanitizer }}/Testing/

  scope-summary:
    if: always()
    needs: [bitcoin-baseline, runners, test-each-commit, macos-native-arm64, windows-native-dll, record-frozen-commit, windows-cross, windows-native-test, ci-matrix, lint, source-review, linux-core, linux-features, optional-functional, asan, instrumented-sanitizers]
    runs-on: ubuntu-slim
    steps:
      - name: Report executed scope without promoting skipped jobs
        run: |
          {
            echo '# ${{ inputs.product }} CI scope'
            echo
            echo 'Event: ${{ github.event_name }}'
            echo
            echo 'Skipped jobs are not passing execution evidence. Weekly/manual supplements and unit-only diagnostics do not establish a full platform-matrix pass. Inactive fuzz variants remain outside this verification package.'
            echo
            echo '| Job | GitHub result |'
            echo '| --- | --- |'
            echo '| bitcoin-baseline | ${{ needs.bitcoin-baseline.result }} |'
            echo '| runners | ${{ needs.runners.result }} |'
            echo '| test-each-commit | ${{ needs.test-each-commit.result }} |'
            echo '| macos-native-arm64 | ${{ needs.macos-native-arm64.result }} |'
            echo '| windows-native-dll | ${{ needs.windows-native-dll.result }} |'
            echo '| record-frozen-commit | ${{ needs.record-frozen-commit.result }} |'
            echo '| windows-cross | ${{ needs.windows-cross.result }} |'
            echo '| windows-native-test | ${{ needs.windows-native-test.result }} |'
            echo '| ci-matrix | ${{ needs.ci-matrix.result }} |'
            echo '| lint | ${{ needs.lint.result }} |'
            echo '| source-review | ${{ needs.source-review.result }} |'
            echo '| linux-core | ${{ needs.linux-core.result }} |'
            echo '| linux-features | ${{ needs.linux-features.result }} |'
            echo '| optional-functional | ${{ needs.optional-functional.result }} |'
            echo '| asan | ${{ needs.asan.result }} |'
            echo '| instrumented-sanitizers | ${{ needs.instrumented-sanitizers.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
